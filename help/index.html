<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForexConnect API Documentation</title>
<style>
  :root {
    --bg: #0e1116;
    --card-bg: #161b22;
    --card-border: #2a3140;
    --card-hover: #1c2330;
    --text: #e6e8eb;
    --text-muted: #9aa4b2;
    --accent: #4f8cff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8;
      --card-bg: #ffffff;
      --card-border: #dfe3e8;
      --card-hover: #eef2fa;
      --text: #1a1f26;
      --text-muted: #5b6472;
      --accent: #2f6fed;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100%;
  }
  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }
  h1 {
    font-size: 1.9rem;
    font-weight: 600;
    margin: 0 0 8px;
  }
  p.lead {
    color: var(--text-muted);
    margin: 0 0 40px;
    font-size: 1.05rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  a.card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 24px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    text-decoration: none;
    color: var(--text);
    transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }
  a.card:hover, a.card:focus-visible {
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .card .icon {
    font-size: 1.6rem;
  }
  .card .name {
    font-size: 1.15rem;
    font-weight: 600;
  }
  .card .desc {
    font-size: 0.9rem;
    color: var(--text-muted);
  }
  footer {
    margin-top: 56px;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>ForexConnect API Documentation</h1>
    <p class="lead">Choose a language to view its API user guide.</p>
    <div class="grid">
      <a class="card" href="CPlusPlus/index.html">
        <span class="icon">🅲</span>
        <span class="name">C++</span>
        <span class="desc">ForexConnect API User Guide for C++</span>
      </a>
      <a class="card" href="DotNet/index.html">
        <span class="icon">🔷</span>
        <span class="name">.NET</span>
        <span class="desc">ForexConnect API User Guide for .NET</span>
      </a>
      <a class="card" href="Java/index.html">
        <span class="icon">☕</span>
        <span class="name">Java</span>
        <span class="desc">ForexConnect API User Guide for Java</span>
      </a>
      <a class="card" href="Python/index.html">
        <span class="icon">🐍</span>
        <span class="name">Python</span>
        <span class="desc">ForexConnect API User Guide for Python</span>
      </a>
    </div>
    <footer>ForexConnect API</footer>
  </div>
</body>
</html>
